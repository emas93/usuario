name: Java CI with Gradle

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_usuario
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 34451191
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d usuario"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar e testar
        run: ./gradlew build

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Gerar e enviar gráfico de dependências
        uses: gradle/actions/dependency-submission@v6
